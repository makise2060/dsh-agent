name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'DSH Agent ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## DSH Agent ${{ inputs.tag || github.ref_name }}

            ### 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `.msi` / `.exe` | MSI 安装包或 NSIS 安装程序 |
            | macOS | `.dmg` | 磁盘镜像 |
            | Linux | `.deb` / `.AppImage` | Debian 包 / AppImage |

            ### 前置要求

            - **Node.js ≥ 22**（dsh 运行时依赖）
            - **dsh**：`npm install -g @deepseek-ai/dsh`（App 内也可一键安装）

            > Windows 用户需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（Win11 已内置）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
