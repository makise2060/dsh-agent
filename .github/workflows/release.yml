name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Windows: 用 Inno Setup 打包
      - name: Build Tauri app (Windows, no bundle)
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --no-bundle

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd src-tauri
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          # 查找 ISCC.exe
          $iscc = $null
          $searchPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $searchPaths) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          # 确认源文件存在
          Write-Host "exe exists: $(Test-Path 'target\release\dsh-agent.exe')"
          Write-Host "dll exists: $(Test-Path 'target\release\WebView2Loader.dll')"
          # 编译
          & $iscc /DAPP_VERSION="$version" installer.iss 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Upload Inno Setup installer (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          name: 'DSH Agent ${{ inputs.tag || github.ref_name }}'
          body: |
            ## DSH Agent ${{ inputs.tag || github.ref_name }}

            ### 下载安装

            | 平台 | 文件 | 说明 |
            |:---:|:---:|:---:|
            | 🪟 Windows | `DSH Agent_x64-setup.exe` | Inno Setup 安装程序（推荐） |
            | 🍎 macOS | `.dmg` | 磁盘镜像 |
            | 🐧 Linux | `.deb` / `.AppImage` | Debian 包 / AppImage |

            ### 前置要求

            - **Node.js ≥ 22**（dsh 运行时依赖）
            - **dsh**：`npm install -g @deepseek-ai/dsh`（App 内也可一键安装）

            > Windows 用户需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（Win11 已内置）。
          draft: false
          prerelease: false
          files: |
            src-tauri/DSH Agent_*-setup.exe

      # 非 Windows 平台继续用 tauri-action
      - name: Build and release (non-Windows)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'DSH Agent ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## DSH Agent ${{ inputs.tag || github.ref_name }}

            ### 下载安装

            | 平台 | 文件 | 说明 |
            |:---:|:---:|:---:|
            | 🪟 Windows | `DSH Agent_x64-setup.exe` | Inno Setup 安装程序（推荐） |
            | 🍎 macOS | `.dmg` | 磁盘镜像 |
            | 🐧 Linux | `.deb` / `.AppImage` | Debian 包 / AppImage |

            ### 前置要求

            - **Node.js ≥ 22**（dsh 运行时依赖）
            - **dsh**：`npm install -g @deepseek-ai/dsh`（App 内也可一键安装）

            > Windows 用户需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（Win11 已内置）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
