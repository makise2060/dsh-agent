name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # fetch-depth: 0 拉取完整历史与 tags，Generate changelog 需要上一个 tag 和全部提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: vars
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD")
          else
            NOTES=$(git log --pretty=format:"- %s" | head -30)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Windows: 用 Inno Setup 打包
      - name: Build Tauri app (Windows, no bundle)
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --no-bundle

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd src-tauri
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          # 查找 ISCC.exe
          $iscc = $null
          $searchPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $searchPaths) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          # 确认源文件存在
          Write-Host "exe exists: $(Test-Path 'target\release\dsh-agent.exe')"
          Write-Host "dll exists: $(Test-Path 'target\release\WebView2Loader.dll')"
          # 编译
          & $iscc /DAPP_VERSION="$version" installer.iss 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Upload Inno Setup installer (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            src-tauri/DSH-Agent_*-setup.exe

      # 非 Windows 平台继续用 tauri-action
      - name: Build and release (non-Windows)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'DSH Agent ${{ steps.vars.outputs.tag }}'
          releaseBody: |
            # DSH Agent ${{ steps.vars.outputs.tag }}

            > DeepSeek Harness 桌面客户端 — 一键启动 `dsh web`，集成环境自检、版本更新、插件市场。

            ---

            ### ⬇️ Download / 下载链接

            <div align="left">

            | **OS / 系统** | **Requirements / 版本要求** | **Direct Links / 点击直链下载** |
            |:---:|:---|:---|
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" alt="Windows" width="28"/> | Windows 10+<br>*(WebView2 Runtime)* | <a href="https://github.com/makise2060/dsh-agent/releases/download/${{ steps.vars.outputs.tag }}/DSH-Agent_${{ steps.vars.outputs.version }}_x64-setup.exe"><img src="https://img.shields.io/badge/Setup-x64-0078D7?logo=windows&logoColor=white&style=flat-square&labelColor=222222"></a> |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/apple/apple-original.svg" alt="macOS" width="28"/> | macOS 12.0+ | <a href="https://github.com/makise2060/dsh-agent/releases/download/${{ steps.vars.outputs.tag }}/DSH.Agent_${{ steps.vars.outputs.version }}_aarch64.dmg"><img src="https://img.shields.io/badge/DMG-Apple%20Silicon-000000?logo=apple&logoColor=white&style=flat-square&labelColor=222222"></a> |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linux/linux-original.svg" alt="Linux" width="28"/> | Linux Kernel 5.4+ | <a href="https://github.com/makise2060/dsh-agent/releases/download/${{ steps.vars.outputs.tag }}/DSH.Agent_${{ steps.vars.outputs.version }}_amd64.AppImage"><img src="https://img.shields.io/badge/AppImage-x64-f84e29?logo=linux&logoColor=white&style=flat-square&labelColor=222222"></a> <a href="https://github.com/makise2060/dsh-agent/releases/download/${{ steps.vars.outputs.tag }}/DSH.Agent_${{ steps.vars.outputs.version }}_amd64.deb"><img src="https://img.shields.io/badge/DEB-x64-A81D33?logo=debian&logoColor=white&style=flat-square&labelColor=222222"></a> <a href="https://github.com/makise2060/dsh-agent/releases/download/${{ steps.vars.outputs.tag }}/DSH.Agent-${{ steps.vars.outputs.version }}-1.x86_64.rpm"><img src="https://img.shields.io/badge/RPM-x64-red?logo=fedora&logoColor=white&style=flat-square&labelColor=222222"></a> |

            </div>

            ---

            ### 🚀 本次更新

            ${{ steps.changelog.outputs.notes }}

            ---

            ### 📋 前置要求

            - **Node.js ≥ 22**（dsh 运行时依赖）
            - **dsh**：`npm install -g @deepseek-ai/dsh`（App 内也可一键安装）

            > Windows 用户需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（Win11 已内置）。

            ### 🐛 Feedback / 问题反馈

            **Bug Report**: [Click Here](https://github.com/makise2060/dsh-agent/issues/new)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
