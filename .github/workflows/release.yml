name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# 专注 Windows：自 v1.2.1 起仅发布 Windows 安装包（Inno Setup）
jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 拉取完整历史与 tags，Generate changelog 需要上一个 tag 和全部提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: vars
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD")
          else
            NOTES=$(git log --pretty=format:"- %s" | head -30)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app (no bundle)
        run: npx tauri build --no-bundle

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          cd src-tauri
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          # 查找 ISCC.exe
          $iscc = $null
          $searchPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $searchPaths) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          # 确认源文件存在
          Write-Host "exe exists: $(Test-Path 'target\release\dsh-agent.exe')"
          Write-Host "dll exists: $(Test-Path 'target\release\WebView2Loader.dll')"
          # 编译
          & $iscc /DAPP_VERSION="$version" installer.iss 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            src-tauri/DSH-Agent_*-setup.exe
