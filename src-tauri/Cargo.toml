[package]
name = "dsh-agent"
version = "1.1.1"
description = "DeepSeek Harness desktop webview wrapper"
authors = ["DrPepper <makise2060@gmail.com>"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "dsh_agent_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "sync"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
semver = "1"
dirs = "5"
log = "0.4"
serde_yaml = "0.9"
